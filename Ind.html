<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Inauguration Ceremony</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@200;400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050203;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Grand Hall Stage Backdrop */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1f0507 0%, #080102 70%, #000000 100%);
      overflow: hidden;
    }

    /* Subtle Ambient Lighting */
    .stage::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.4; transform: scale(0.95); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Poster Container & Framing */
    .poster-frame {
      position: relative;
      max-width: 100vh;
      max-height: 100vw;
      transform: rotate(-90deg);
      border-radius: 4px;
      padding: 4px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.6), rgba(80, 15, 20, 0.4), rgba(212, 175, 55, 0.3));
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95);
      transition: box-shadow 1.2s ease, border-color 1.2s ease;
      z-index: 5;
    }

    .poster-img {
      display: block;
      max-width: 88vh;
      max-height: 88vw;
      border-radius: 2px;
    }

    /* Formal Ceremonial Overlay */
    .ceremony-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 1, 2, 0.78);
      backdrop-filter: blur(12px);
      z-index: 10;
      cursor: pointer;
      opacity: 1;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s ease;
    }

    .header-title {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      letter-spacing: 8px;
      color: rgba(212, 175, 55, 0.8);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Refined Trigger Button */
    .inaugurate-btn {
      position: relative;
      padding: 20px 60px;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #f7eed6;
      background: rgba(15, 3, 5, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.7);
      border-radius: 2px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.15);
      text-transform: uppercase;
      transition: all 0.5s ease;
    }

    .inaugurate-btn::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      pointer-events: none;
    }

    .sub-text {
      margin-top: 20px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    /* Minimalist Precision Progress Line */
    .progress-container {
      display: none;
      width: 320px;
      text-align: center;
    }

    .progress-status {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 5px;
      color: #d4af37;
      margin-bottom: 16px;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #8a6d2b, #ffd700, #ffffff);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      transition: width 0.04s linear;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 30;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="poster-frame" id="posterFrame">
      <img src="20260812_112835.jpg" class="poster-img" alt="Al Murafaqa Poster">
    </div>

    <!-- Formal Overlay -->
    <div class="ceremony-overlay" id="overlay" onclick="startInauguration()">
      <div id="interactiveContent" style="text-align: center;">
        <div class="header-title">Official Inauguration</div>
        <div class="inaugurate-btn">Unveil Program</div>
        <div class="sub-text">Tap screen to commence</div>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-status">IN AUGURATING...</div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="ambientCanvas"></canvas>

  <script>
    let initiated = false;

    // Harmonic Audio Chime (Warm, Deep Resonance)
    function playFormalChime() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      const tones = [130.81, 196.00, 261.63, 329.63, 392.00, 523.25]; // Deep C-Major Orchestra Chord

      tones.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.06));
        
        gain.gain.setValueAtTime(0.001, ctx.currentTime + (i * 0.06));
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + (i * 0.06) + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (i * 0.06) + 3.5);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(ctx.currentTime + (i * 0.06));
        osc.stop(ctx.currentTime + (i * 0.06) + 3.5);
      });
    }

    function startInauguration() {
      if (initiated) return;
      initiated = true;

      const interactiveContent = document.getElementById('interactiveContent');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const posterFrame = document.getElementById('posterFrame');
      const overlay = document.getElementById('overlay');

      interactiveContent.style.display = 'none';
      progressContainer.style.display = 'block';

      playFormalChime();

      let progress = 0;
      const timer = setInterval(() => {
        progress += 2;
        progressBar.style.width = progress + '%';

        if (progress >= 100) {
          clearInterval(timer);
          
          // Completely eliminate overlay, leaving ONLY the image
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
          }, 1000);

          // Reveal gold halo surrounding the framed photo
          posterFrame.style.boxShadow = '0 0 120px rgba(212, 175, 55, 0.6)';
          
          triggerGoldenEmbers();
        }
      }, 25);
    }

    // Elegant Golden Ember Dust Particles
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    
    function setCanvasBounds() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    setCanvasBounds();
    window.addEventListener('resize', setCanvasBounds);

    let particles = [];

    function triggerGoldenEmbers() {
      const goldTones = ['#d4af37', '#f3e5ab', '#ffffff', '#aa7c11'];
      
      for (let i = 0; i < 120; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 6 + 1.5;
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity - 1,
          radius: Math.random() * 2 + 1,
          color: goldTones[Math.floor(Math.random() * goldTones.length)],
          alpha: 1,
          decay: Math.random() * 0.008 + 0.003
        });
      }
      animateParticles();
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02; // Minimal gravity
        p.alpha -= p.decay;

        ctx.save();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      if (particles.length > 0) {
        requestAnimationFrame(animateParticles);
      }
    }
  </script>
</body>
  </html>
